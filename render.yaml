version: "1"
projects:
- name: My project
  environments:
  - name: Production
    services:
    - type: web
      name: mb-monitor-relay
      runtime: python
      repo: https://github.com/YulioXXX/mb-monitor-relay
      plan: free
      envVars:
      - key: JWT_SECRET
        sync: false
      region: virginia
      buildCommand: pip install -r requirements.txt
      startCommand: python relay_server.py
      autoDeployTrigger: commit
      rootDir: relay
    - type: web
      name: monitor-auth
      runtime: python
      repo: https://github.com/YulioXXX/mb-monitor-relay
      plan: free
      envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      region: virginia
      buildCommand: pip install -r requirements.txt
      startCommand: uvicorn auth_server:app --host 0.0.0.0 --port 10000
      autoDeployTrigger: commit
      rootDir: auth/
