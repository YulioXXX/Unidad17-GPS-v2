services:
  app:
    build: .
    restart: unless-stopped
    environment:
      UNIDAD17_PROXY: "1"
      UNIDAD17_URL_PUBLICA: "${URL_PUBLICA:-}"
      UNIDAD17_COOKIE_SEGURA: "${COOKIE_SEGURA:-1}"
    volumes:
      - unidad17_data:/data      # base de datos, config.json y paquetes de actualización
    expose:
      - "5000"                   # solo visible para Caddy, no se publica al exterior

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: "${DOMINIO:?define DOMINIO en el archivo .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  unidad17_data:
  caddy_data:
  caddy_config:
